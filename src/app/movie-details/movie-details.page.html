<ion-header><ion-toolbar><ion-title><span class="wordmark">FRAME</span> / FILM</ion-title></ion-toolbar></ion-header>
<ion-content class="ion-padding">
  <div class="details-shell">
    <ion-button fill="clear" routerLink="/movies">← Retour au catalogue</ion-button>
    @if (movie) {
      <ion-card>
        <img class="poster" [src]="movie.poster" [alt]="movie.title">
        <ion-card-content>
          <p class="eyebrow">{{ movie.genre }} / {{ movie.year }}</p>
          <h1>{{ movie.title }}</h1>
          <p class="overview">{{ movie.overview }}</p>
          <ion-button expand="block" [color]="isFavorite() ? 'warning' : 'primary'" (click)="toggleFavorite()">
            {{ isFavorite() ? 'Dans ma playlist' : 'Ajouter à ma playlist' }}
          </ion-button>
        </ion-card-content>
      </ion-card>
    }
  </div>
</ion-content>
